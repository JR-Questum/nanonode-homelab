---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false
  check_mode: false

- name: Simulate dist-upgrade
  ansible.builtin.command:
    cmd: apt-get --simulate dist-upgrade -o APT::Get::Show-User-Simulation-Note=false
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: check_pending_updates_simulation
  changed_when: false
  check_mode: false

- name: Count the packages a dist-upgrade would change
  ansible.builtin.set_fact:
    check_pending_updates_count: >-
      {{ check_pending_updates_simulation.stdout_lines
         | select('match', '^Inst ')
         | list | length }}

- name: Find newest kernel installed in /boot
  ansible.builtin.shell:
    cmd: set -o pipefail && ls /boot/vmlinuz-* | sed 's|.*/vmlinuz-||' | sort -V | tail -1
    executable: /bin/bash
  register: check_pending_updates_newest_kernel
  changed_when: false
  check_mode: false

- name: Find running kernel
  ansible.builtin.command:
    cmd: uname -r
  register: check_pending_updates_running_kernel
  changed_when: false
  check_mode: false

- name: Determine whether a kernel activation is pending
  ansible.builtin.set_fact:
    check_pending_updates_kernel_pending: >-
      {{ check_pending_updates_newest_kernel.stdout | length > 0
         and check_pending_updates_newest_kernel.stdout
             != check_pending_updates_running_kernel.stdout }}

- name: Determine whether this node needs anything
  ansible.builtin.set_fact:
    check_pending_updates_required: >-
      {{ check_pending_updates_count | int > 0
         or check_pending_updates_kernel_pending | bool }}

- name: Report what this node needs
  ansible.builtin.debug:
    msg: >-
      {{ check_pending_updates_count }} package(s) pending,
      running kernel {{ check_pending_updates_running_kernel.stdout }},
      newest installed {{ check_pending_updates_newest_kernel.stdout }}
      - {{ 'update required' if check_pending_updates_required | bool
           else 'nothing to do' }}