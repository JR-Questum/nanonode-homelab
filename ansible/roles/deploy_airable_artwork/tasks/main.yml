---
- name: Ensure the artwork directory exists
  ansible.builtin.file:
    path: "{{ deploy_airable_artwork_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the artwork fetcher is in place
  ansible.builtin.copy:
    src: fetch_artwork.py
    dest: "{{ deploy_airable_artwork_dir }}/fetch_artwork.py"
    owner: root
    group: root
    mode: "0755"
    validate: 'python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s'

- name: Ensure the artwork service unit is in place
  ansible.builtin.template:
    src: artwork.service.j2
    dest: "/etc/systemd/system/{{ deploy_airable_artwork_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: deploy_airable_artwork | Reload systemd

- name: Ensure the artwork timer unit is in place
  ansible.builtin.template:
    src: artwork.timer.j2
    dest: "/etc/systemd/system/{{ deploy_airable_artwork_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  notify: deploy_airable_artwork | Reload systemd

- name: Flush handlers so the timer is enabled against current units
  ansible.builtin.meta: flush_handlers

- name: Ensure the artwork timer is in the desired state
  ansible.builtin.systemd_service:
    name: "{{ deploy_airable_artwork_name }}.timer"
    enabled: "{{ deploy_airable_artwork_state_enabled | bool }}"
    state: "{{ 'started' if deploy_airable_artwork_state_enabled | bool
               else 'stopped' }}"

# Populates the image immediately rather than leaving the tap serving
# nothing until the first timer tick.
- name: Fetch the cover once now
  ansible.builtin.command:
    argv:
      - systemctl
      - start
      - "{{ deploy_airable_artwork_name }}.service"
  changed_when: true
  when: deploy_airable_artwork_state_enabled | bool
