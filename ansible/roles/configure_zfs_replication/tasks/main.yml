---
- name: Assert replication variables are defined
  ansible.builtin.assert:
    that:
      - configure_zfs_replication_vmid is not none
      - configure_zfs_replication_source_node is not none
      - configure_zfs_replication_source_node not in configure_zfs_replication_targets
    fail_msg: >-
      configure_zfs_replication requires vmid and source_node,
      and source_node must not appear in targets.
    quiet: true

- name: Read existing replication jobs
  ansible.builtin.command:
    cmd: pvesh get /cluster/replication --output-format json
  register: _pvesr
  changed_when: false
  become: false
  delegate_to: "{{ configure_zfs_replication_source_node }}"

- name: Create missing replication jobs
  ansible.builtin.command:
    cmd: >-
      pvesr create-local-job
      {{ configure_zfs_replication_vmid }}-{{ _free_ids[ansible_loop.index0] }}
      {{ item }}
      --schedule '{{ configure_zfs_replication_schedule }}'
      --comment '{{ configure_zfs_replication_comment }}'
      {{ '--rate ' ~ configure_zfs_replication_rate if configure_zfs_replication_rate else '' }}
      {{ '--disable 1' if configure_zfs_replication_disabled else '' }}
  loop: "{{ _missing_targets }}"
  loop_control:
    extended: true
    label: "{{ configure_zfs_replication_vmid }} -> {{ item }}"
  changed_when: true
  become: false
  delegate_to: "{{ configure_zfs_replication_source_node }}"

- name: Remove replication jobs that are no longer wanted
  ansible.builtin.command:
    cmd: pvesr delete {{ item }} --force
  loop: "{{ _orphan_ids }}"
  loop_control:
    label: "{{ item }}"
  when: configure_zfs_replication_prune
  changed_when: true
  become: false
  delegate_to: "{{ configure_zfs_replication_source_node }}"