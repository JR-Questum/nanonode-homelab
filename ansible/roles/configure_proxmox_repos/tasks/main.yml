---
- name: Disable PVE enterprise repository
  ansible.builtin.deb822_repository:
    name: pve-enterprise
    types: [deb]
    uris: https://enterprise.proxmox.com/debian/pve
    suites: "{{ configure_proxmox_repos_suite }}"
    components: [pve-enterprise]
    signed_by: "{{ configure_proxmox_repos_keyring }}"
    enabled: false
    state: present

- name: Disable enterprise Ceph repository
  ansible.builtin.deb822_repository:
    name: ceph
    types: [deb]
    uris: "https://enterprise.proxmox.com/debian/{{ configure_proxmox_repos_ceph_release }}"
    suites: "{{ configure_proxmox_repos_suite }}"
    components: [enterprise]
    signed_by: "{{ configure_proxmox_repos_keyring }}"
    enabled: false
    state: present

- name: Enable PVE no-subscription repository
  ansible.builtin.deb822_repository:
    name: pve-no-subscription
    types: [deb]
    uris: http://download.proxmox.com/debian/pve
    suites: "{{ configure_proxmox_repos_suite }}"
    components: [pve-no-subscription]
    signed_by: "{{ configure_proxmox_repos_keyring }}"
    enabled: true
    state: present
