---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  register: configure_hostname_set

- name: Ensure /etc/hosts resolves every cluster member
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ hostvars[item].ansible_host | default(item) | regex_escape }}\\s"
    line: "{{ hostvars[item].ansible_host | default(item) }} {{ item }}.{{ configure_hostname_domain }} {{ item }}"
    state: present
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ansible_play_hosts }}"

- name: Reboot to complete hostname change
  ansible.builtin.reboot:
    msg: "Rebooting to apply hostname change"
    reboot_timeout: 600
  when: 
    - configure_hostname_set.changed

- name: Confirm hostnames
  ansible.builtin.command:
    cmd: hostname
  changed_when: false
  register: configure_hostname_verify
  failed_when: configure_hostname_verify.stdout != inventory_hostname
