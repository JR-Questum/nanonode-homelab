[defaults]
inventory = private/inventory

roles_path = roles:.galaxy_roles
collections_path = collections

vault_password_file = ~/.config/nanonode/vault_pass

host_key_checking = False

#stdout_callback = community.general.unixy
#callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
#result_format = yaml
#interpreter_python = auto_silent

callback_plugins = ./callback_plugins
stdout_callback  = nier_boot

[nier_boot]
unit_name  = NANONODE
typewriter = true
timing_report = -1

forks = 10
retry_files_enabled = False

[callback_profile_tasks]
sort_order = none
task_output_limit = all

[ssh_connection]
pipelining = True
